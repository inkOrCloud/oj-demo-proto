name: Buf Update Pipeline

on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [buf]  # 仅当 buf 分支有更新时触发

jobs:
  export-buf:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: 'exported-buf-artifact'
    steps:
      - name: Checkout code (buf branch)
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'

      - name: Install buf CLI
        run: npm install -g @bufbuild/buf

      - name: Run buf export
        run: npx buf export -o output  # 生成 output 目录

      - name: Archive exported files
        uses: actions/upload-artifact@v3
        with:
          name: exported-buf-artifact
          path: output/

  update-buf:
    needs: export-buf
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许推送更改到仓库
    steps:
      - name: Checkout code (main branch)
        uses: actions/checkout@v4
        with:
          ref: export
      - name: clean existing buf files
        run: git rm -r .
      - name: Download exported artifact
        uses: actions/download-artifact@v3
        with:
          name: ${{ needs.export-buf.outputs.artifact-name }}
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Update exported buf files' || echo "No changes to commit"
          git push origin export
