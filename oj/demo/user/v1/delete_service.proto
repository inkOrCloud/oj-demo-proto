syntax = "proto3";
package oj.demo.user.v1;

import "buf/validate/validate.proto";

message DeleteUserRequest {
  string password = 1 [
    (buf.validate.field).string.min_len = 6,
    (buf.validate.field).string.max_len = 20,
    (buf.validate.field).string.pattern = "^[a-zA-Z0-9!@#$%^&*_]+$"
  ];
}

enum DeleteUserStatus {
  DELETE_USER_STATUS_SUCCESS_UNSPECIFIED = 0;
  DELETE_USER_STATUS_PASSWORD_INCORRECT = 1;
  DELETE_USER_STATUS_ARG_INVALID = 2;
}

message DeleteUserResponse {
  DeleteUserStatus status = 1;
}

service DeleteUserService {
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}
