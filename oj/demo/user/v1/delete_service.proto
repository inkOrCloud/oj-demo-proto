syntax = "proto3";
package oj.demo.user.v1;

option java_multiple_files = true;
option java_package = "oj.demo.user.api.v1.delete";

message DeleteUserRequest {
  string password = 1;
}

enum DeleteUserStatus {
  DELETE_USER_STATUS_SUCCESS_UNSPECIFIED = 0;
  DELETE_USER_STATUS_PASSWORD_INCORRECT = 1;
  DELETE_USER_STATUS_ARG_INVALID = 2;
}

message DeleteUserResponse {
  DeleteUserStatus status = 1;
}

service DeleteUserService {
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}
