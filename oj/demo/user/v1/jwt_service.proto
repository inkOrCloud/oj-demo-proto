syntax = "proto3";
package oj.demo.user.v1;

message AccessTokenPayload {
  int32 user_id = 1;
  int32 user_profile_id = 2;
  int64 expire = 5;
}

message AccessTokenPublicKey {
  bytes key = 1;
  int64 create_time = 2;
  int64 ttl = 3;
}

message AccessTokenPublicKeys {
  repeated AccessTokenPublicKey keys = 1;
}
