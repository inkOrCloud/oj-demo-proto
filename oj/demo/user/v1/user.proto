syntax = "proto3";
package oj.demo.user.v1;

option java_multiple_files = true;
option java_package = "oj.demo.user.api.v1.dto";

message User {
  int32 id = 1;
  string email = 4;
  int64 create_time = 5;
  int64 update_time = 6;
  int64 delete_time = 7;
}

message UserProfile {
  int32 id = 1;
  int32 user_id = 2;
  string username = 3;
  string bio = 4;
  int64 avatar_file_id = 5;
  int64 create_time = 6;
  int64 update_time = 7;
  int64 delete_time = 8;
}
