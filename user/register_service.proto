package oj.demo.user;
edition = "2024";
option java_package = "oj.demo.user.api.register";
option java_multiple_files = true;

message RegisterRequest {
    string email = 1;
    string password = 2;
    string code = 3;
}

enum RegisterStatus {
    REGISTER_STATUS_SUCCESS = 0;
    EMAIL_ALREADY_EXISTS = 1;
    CODE_INVALID = 2;
    ARGS_INVALID = 3;
    TOO_MANY_REQUESTS = 4;
}

message RegisterResponse {
    RegisterStatus status = 1;
    int32 user_id = 2;
}