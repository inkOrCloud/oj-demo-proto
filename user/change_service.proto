syntax = "proto3";
package oj.demo.user;
option java_package = "oj.demo.user.api.change";
option java_multiple_files = true;

message ChangeRequest {
    string old_password = 1;
    string new_password = 2;
    string refresh_token = 3;
}

enum ChangeStatus {
    CHANGE_STATUS_SUCCESS = 0;
    CHANGE_STATUS_OLD_PASSWORD_INCORRECT = 1;
    CHANGE_STATUS_ARGS_INVALID = 2;
    CHANGE_STATUS_TOO_MANY_REQUESTS = 3;
    CHANGE_STATUS_REFRESH_TOKEN_INVALID = 4;
}

message ChangeResponse {
    ChangeStatus status = 1;
}

service ChangeService {
    rpc ChangePassword(ChangeRequest) returns (ChangeResponse);
}